# Builds the HEAPY Edge Docker image for Raspberry Pi (arm64) and x86 (amd64)
# on every push to main and every version tag, and publishes it to
# GitHub Container Registry: ghcr.io/dys3d/heapy-edge
name: Build image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # a venv keeps pip away from Ubuntu's own python packages; the box runs it as root
      - name: Python for the drivers and simulators
        run: |
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install -q -r drivers/bacnet-ip/requirements.txt -r drivers/snmp/requirements.txt -r tests/requirements-test.txt
          "$HOME/venv/bin/python" -c "import bacpypes3, pysnmp, cryptography, snmpsim; print('python deps ok', cryptography.__version__)"
      - run: sudo apt-get install -y iproute2
      - run: sudo -E env "PATH=$HOME/venv/bin:$PATH" HEAPY_EDGE_PYTHON="$HOME/venv/bin/python" node --no-warnings tests/selftest.js
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/heapy-edge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
