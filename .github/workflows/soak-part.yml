# One piece of the soak test (see soak.yml).
name: Soak part
on:
  workflow_call:
    inputs:
      kind: { type: string, required: true }
      part: { type: number, required: true }
      next: { type: number, required: true }
      hours: { type: string, required: true }
      interval: { type: string, required: true }
permissions:
  contents: write   # results are pushed to the soak-results branch
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q iproute2 faketime
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install -q -r drivers/bacnet-ip/requirements.txt -r drivers/snmp/requirements.txt -r tests/requirements-test.txt
          "$HOME/venv/bin/python" -c "import bacpypes3, pysnmp, cryptography, snmpsim; print('python deps ok')"
      - name: MS/TP router and test devices
        if: inputs.kind == 'mstp'
        run: sh tools/build-bacnet-stack.sh
      - name: State from the previous part
        if: inputs.part > 1
        uses: actions/download-artifact@v4
        with: { name: 'soak-state-${{ inputs.kind }}-${{ inputs.part }}', path: soak }
      - name: Soak
        run: |
          mkdir -p soak
          if [ -f soak/state.json ] && grep -q '"finished": true' soak/state.json; then echo "already finished"; exit 0; fi
          sudo -E env "PATH=$HOME/venv/bin:$PATH" HEAPY_EDGE_PYTHON="$HOME/venv/bin/python" node --no-warnings tests/soak24.js --kind ${{ inputs.kind }} --hours ${{ inputs.hours }} --interval ${{ inputs.interval }} --dir "$PWD/soak" --segment-minutes 330
          grep -h "hour\|FINISHED\|STOPPED\|CRASH" soak/soak.log | tail -20
          if grep -q '"finished": true' soak/state.json && ! grep -q '"pass": true' soak/state.json; then echo "SOAK FAILED"; exit 2; fi
      - name: Tidy
        if: always()
        run: sudo chown -R "$(id -u)" soak; rm -f soak/*.sock
      - name: Hand the state to the next part
        uses: actions/upload-artifact@v4
        with: { name: 'soak-state-${{ inputs.kind }}-${{ inputs.next }}', path: soak, retention-days: 3 }
      - name: Result so far
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'soak-result-${{ inputs.kind }}-part${{ inputs.part }}', path: 'soak/state.json', retention-days: 30 }
      # Also keep the result where it can be read without the artifact store:
      # branch soak-results, one folder per driver (state.json + soak.log)
      - name: Publish result to the soak-results branch
        if: always()
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          KIND: ${{ inputs.kind }}
          PART: ${{ inputs.part }}
        run: |
          set -eux
          for i in 1 2 3 4 5 6; do
            rm -rf results
            if git ls-remote --exit-code --heads "$REPO_URL" soak-results >/dev/null; then
              git clone -q --branch soak-results --depth 1 "$REPO_URL" results
            else
              git init -q results && git -C results checkout -q -b soak-results
            fi
            mkdir -p "results/$KIND"
            cp soak/state.json "results/$KIND/state.json"
            cp soak/soak.log "results/$KIND/soak.log" || true
            git -C results config user.name soak-bot; git -C results config user.email soak@heapy-edge
            git -C results add -A
            git -C results commit -q -m "$KIND part $PART $(date -u +%FT%TZ)" || echo "nothing new"
            # several soaks publish at once: on a lost race, start again from a fresh clone
            if git -C results push -q "$REPO_URL" HEAD:soak-results; then exit 0; fi
            sleep $((i*7))
          done
          echo "could not push results"; exit 1
