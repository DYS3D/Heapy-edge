# One piece of the soak test (see soak.yml).
name: Soak part
on:
  workflow_call:
    inputs:
      part: { type: number, required: true }
      hours: { type: string, required: true }
      interval: { type: string, required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q iproute2 faketime
          sudo python3 -m pip install --break-system-packages -r drivers/bacnet-ip/requirements.txt
      - name: State from the previous part
        if: inputs.part > 1
        uses: actions/download-artifact@v4
        with: { name: 'soak-state-${{ inputs.part }}', path: soak }
      - name: Soak
        run: |
          mkdir -p soak
          if [ -f soak/state.json ] && grep -q '"finished": true' soak/state.json; then echo "already finished"; exit 0; fi
          sudo -E env "PATH=$PATH" node --no-warnings tests/soak24.js --hours ${{ inputs.hours }} --interval ${{ inputs.interval }} --dir "$PWD/soak" --segment-minutes 335
          grep -h "hour\|FINISHED\|STOPPED\|CRASH" soak/soak.log | tail -20
      - name: Tidy
        if: always()
        run: sudo chown -R "$(id -u)" soak; rm -f soak/*.sock
      - name: Hand the state to the next part
        uses: actions/upload-artifact@v4
        with: { name: 'soak-state-${{ inputs.part + 1 }}', path: soak, retention-days: 3 }
      - name: Result so far
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'soak-result-part${{ inputs.part }}', path: 'soak/state.json', retention-days: 30 }
